<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム音声文字起こし - Whisper</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎤 リアルタイム音声文字起こし</h1>
            <p>Whisperを使用したリアルタイム文字起こしアプリ</p>
        </header>

        <div class="controls">
            <button id="startBtn" class="btn btn-start">🎤 録音開始</button>
            <button id="stopBtn" class="btn btn-stop" disabled>⏹️ 録音停止</button>
            <div class="status" id="status">マイクへのアクセス許可が必要です</div>
        </div>

        <div class="transcription-area">
            <div class="live-screen" id="liveScreen">
                <!-- ニコニコ風に流れるテキストがここに表示される -->
            </div>
            
            <div class="history-panel">
                <h3>📝 文字起こし履歴</h3>
                <div class="history-content" id="historyContent">
                    <!-- 文字起こし履歴がここに表示される -->
                </div>
            </div>
        </div>

        <div class="settings">
            <h3>⚙️ 設定</h3>
            <div class="setting-group">
                <label for="textColor">テキスト色:</label>
                <input type="color" id="textColor" value="#ffffff">
            </div>
            <div class="setting-group">
                <label for="textSpeed">流れる速度:</label>
                <select id="textSpeed">
                    <option value="slow">遅い</option>
                    <option value="medium" selected>普通</option>
                    <option value="fast">速い</option>
                </select>
            </div>
            <div class="setting-group">
                <label for="textPosition">表示位置:</label>
                <select id="textPosition">
                    <option value="top">上部</option>
                    <option value="middle" selected>中央</option>
                    <option value="bottom">下部</option>
                    <option value="random">ランダム</option>
                </select>
            </div>
        </div>
    </div>

    <script src="/static/js/transcription.js"></script>
</body>
</html>
