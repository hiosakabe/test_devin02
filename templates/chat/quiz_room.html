<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ quiz_id }} | ニコニコ風クイズ</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>クイズルーム: {{ quiz_id }}</h1>
            <a href="/" class="back-link">ルーム一覧に戻る</a>
        </header>
        
        <div class="chat-layout">
            <div id="chat-screen" class="chat-screen">
                <!-- ビデオ背景 -->
                <div id="video-background" class="video-background">
                    {% if room.background_type == 'youtube' %}
                        <div id="youtube-player"></div>
                    {% elif room.background_type == 'upload' %}
                        <video id="custom-video" autoplay loop muted>
                            <source src="{{ room.background_url }}" type="video/mp4">
                            お使いのブラウザは動画の再生に対応していません。
                        </video>
                    {% endif %}
                </div>
                <!-- ここにメッセージが流れる -->
            </div>
            <div id="chat-history" class="chat-history">
                <!-- ここに過去のメッセージが表示される -->
            </div>
        </div>
        
        <div class="chat-controls">
            <div class="username-container">
                <input type="text" id="username" placeholder="ユーザー名" value="匿名">
            </div>
            
            <div class="message-container">
                <input type="text" id="chat-message-input" placeholder="メッセージを入力...">
                <button id="chat-message-submit" class="btn">送信</button>
            </div>
            
            <div class="message-options">
                <div class="option">
                    <label for="message-color">色:</label>
                    <input type="color" id="message-color" value="#000000">
                </div>
                
                <div class="option">
                    <label for="message-speed">速度:</label>
                    <select id="message-speed">
                        <option value="2">遅い</option>
                        <option value="5" selected>普通</option>
                        <option value="8">速い</option>
                    </select>
                </div>
                
                <div class="option">
                    <label for="message-position">位置:</label>
                    <select id="message-position">
                        <option value="top">上</option>
                        <option value="middle" selected>中央</option>
                        <option value="bottom">下</option>
                        <option value="random">ランダム</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="video-background-controls">
            <h3>背景動画設定</h3>
            <form method="post" enctype="multipart/form-data" class="video-form">
                {% csrf_token %}
                <div class="video-option">
                    <label for="id_youtube_url">YouTube URL:</label>
                    <input type="url" name="youtube_url" id="id_youtube_url" placeholder="https://www.youtube.com/watch?v=XXXXXXXXXXX">
                    <button type="button" id="set-youtube" class="btn">設定</button>
                </div>
                <div class="video-option">
                    <label for="id_video">動画アップロード:</label>
                    <input type="file" name="video" id="id_video" accept="video/mp4,video/webm,video/ogg">
                    <button type="submit" class="btn">アップロード</button>
                </div>
                <div class="video-option">
                    <button type="button" id="remove-background" class="btn btn-danger">背景を削除</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="/static/js/quiz.js"></script>
    <script>
        // クイズIDをJavaScriptに渡す
        const quizId = "{{ quiz_id }}";
        const backgroundType = "{{ room.background_type }}";
        const backgroundUrl = "{{ room.background_url }}";
    </script>
</body>
</html>
